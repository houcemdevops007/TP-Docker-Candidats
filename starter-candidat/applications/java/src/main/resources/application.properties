# TP Docker DevSecOps - configuration de l'API Java
spring.application.name=tp-docker-java

# Port d'ecoute : surchargeable via la variable d'environnement PORT
server.port=${PORT:8080}

# Arret propre (graceful shutdown) a la reception de SIGTERM (docker stop)
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=10s

# Version injectee depuis le pom.xml au moment du build Maven (filtrage @...@)
app.version=@project.version@

# Environnement d'execution : surchargeable via APP_ENV
app.environment=${APP_ENV:dev}
